# Rafraîchit prix/stock Instant Gaming tous les jours + redéploie Cloudflare Pages
name: Refresh prices

on:
  schedule:
    # Tous les jours 06:15 UTC ≈ 08:15 Paris (hiver) / 07:15 (été)
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh IG prices, Steam store prices & history
        run: python3 scripts/refresh-ig-prices.py

      - name: Discover trending games & update ranks
        run: python3 scripts/discover-games.py --update-ranks

      - name: Regenerate fiches & pre-rendered pages
        run: node scripts/generate-fiches.js

      - name: Enrich guides & sync assets
        run: node scripts/enrich-guides.js

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh Instant Gaming prices/stock & trends"
          file_pattern: js/catalog.js data index.html deals.html mes-jeux.html pc-builder.html 404.html a-propos.html mentions-legales.html confidentialite.html jeu guides sitemap.xml sitemap-jeux.xml
          commit_user_name: jeuxstash-bot
          commit_user_email: bot@jeuxstash.fr

      - name: Deploy Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy . --project-name=jeuxstash --branch=main --commit-dirty=true
